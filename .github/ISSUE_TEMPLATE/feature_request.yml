name: 💡 功能建议 (Feature Request)
description: 为 MeiloX 提出新功能想法、交互改进或性能优化方案
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 MeiloX 的演进提供思路与建议！
        
        > [!TIP]
        > MeiloX 是一款基于 Jetpack Compose 构建、主打 Apple Music 视觉与交互风格的网易云音乐第三方客户端。
        > 在提出建议前，请先在 [Issues](https://github.com/NEORUAA/MeiloX/issues) 检索是否已有类似提议或正在实现的规划。

  - type: dropdown
    id: category
    attributes:
      label: 建议分类
      description: 请选择该建议涉及的方向
      options:
        - 🎨 界面与视觉交互（Apple Music 风格细节、液态玻璃、MiniPlayer、动态封面、深浅主题）
        - 🎵 播放控制与音质（播放队列管理、均衡器、音量平衡、心动模式、定时关闭）
        - 📝 歌词与共享功能（逐字动效、多语言歌词/翻译、Lyricon/SuperLyricApi 拓展）
        - 📁 媒体库与内容浏览（自建歌单、离线下载、本地音乐、歌手/专辑详情页）
        - 🚀 性能与底层优化（渲染管线、AGSL/Shader、Compose 重组、内存与电量优化）
        - 💡 其它功能建议
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MeiloX 完整版本号
      description: 请填写「设置 → 关于」显示的完整版本号，包含括号内的 commit hash；构建号或链接不能替代版本号。
      placeholder: 版本 1.55.1 (0070ef96)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 背景与痛点
      description: 当前遇到了什么不便？或者为什么需要这个功能？
      placeholder: 请描述当前在什么场景下体验不佳，或希望满足怎样的使用需求...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 方案设想与交互细节
      description: 详细描述你希望实现的功能形态、入口位置、操作逻辑
      placeholder: 请尽可能具体地描述该功能应该如何运作、有怎样的交互流程...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 参考设计或备选方案（可选）
      description: 是否有 Apple Music、网易云音乐、MeloX 或其他播放器的成熟设计参考？
      placeholder: 可附带参考截图、设计草图或链接

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认清单
      options:
        - label: 我已安装并检查 [GitHub Actions 最新构建](https://github.com/NEORUAA/MeiloX/actions/workflows/main.yml)，确认该功能尚未实现
          required: true
        - label: 我已检索过现有 Issues，确认此前没有提交过相同的建议
          required: true
        - label: 我理解 MeiloX 是个人维护的开源客户端，新功能会优先考虑与 iOS / Apple Music 风格的契合度及维护成本
          required: true
