name: Build and Release

on:
  push:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '发布说明（可选，默认使用 .github/release_notes.md）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    environment: release
    runs-on: ubuntu-latest
    outputs:
      standalone_artifact_name: ${{ steps.release_metadata.outputs.standalone_artifact_name }}
      parasite_artifact_name: ${{ steps.release_metadata.outputs.parasite_artifact_name }}
      release_name: ${{ steps.release_metadata.outputs.release_name }}
      tag_name: ${{ steps.release_metadata.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Check paired release workflow
        run: ruby .github/tests/dual_runtime_release_test.rb

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test both runtimes
        id: build_apks
        run: >-
          ./gradlew :app:testStandaloneDebugUnitTest :app:testParasiteDebugUnitTest
          :app:assembleStandaloneRelease :app:assembleParasiteRelease

      - name: Read paired release metadata
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail
          for flavor in standalone parasite; do
            directory="app/build/outputs/apk/$flavor/release"
            metadata_file="$directory/output-metadata.json"
            application_id="com.neoruaa.meilox"
            if [[ "$flavor" == parasite ]]; then application_id+=".parasite"; fi
            jq -e --arg application_id "$application_id" --arg variant "${flavor}Release" '
              .artifactType.type == "APK" and .applicationId == $application_id and
              .variantName == $variant and (.elements | length) == 1 and
              .elements[0].type == "SINGLE" and .elements[0].filters == [] and
              (.elements[0].versionCode | type == "number" and . > 0 and . == floor) and
              (.elements[0].versionName | type == "string") and
              (.elements[0].outputFile | type == "string")
            ' "$metadata_file" > /dev/null
            version_name="$(jq -r '.elements[0].versionName' "$metadata_file")"
            version_code="$(jq -r '.elements[0].versionCode' "$metadata_file")"
            output_file="$(jq -r '.elements[0].outputFile' "$metadata_file")"
            if [[ ! "$version_name" =~ ^[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] ||
               [[ ! "$output_file" =~ ^[A-Za-z0-9_.-]+\.apk$ ]] || [[ ! -s "$directory/$output_file" ]]; then
              echo "::error::Invalid $flavor release metadata or missing APK"
              exit 1
            fi
            if [[ "$flavor" == standalone ]]; then
              paired_version_name="$version_name"
              paired_version_code="$version_code"
            elif [[ "$version_name" != "$paired_version_name" || "$version_code" != "$paired_version_code" ]]; then
              echo '::error::Standalone and parasite release versions differ'
              exit 1
            fi
          done
          release_date="$(TZ=Asia/Hong_Kong date +%y%m%d)"
          {
            echo "standalone_artifact_name=MeiloX-standalone-${version_name}-${GITHUB_RUN_NUMBER}"
            echo "parasite_artifact_name=MeiloX-parasite-${version_name}-${GITHUB_RUN_NUMBER}"
            echo "release_name=${release_date}_${version_name}"
            echo "tag_name=${version_name}"
            echo "version_code=${version_code}"
          } >> "$GITHUB_OUTPUT"

      - name: Sign both APKs
        id: sign_apks
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_KEY"
          keystore="$(mktemp "$RUNNER_TEMP/meilox-signing-XXXXXX")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"
          signer="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          arguments=(--ks "$keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_STORE_PASSWORD)
          if [[ -n "$KEY_PASSWORD" ]]; then arguments+=(--key-pass env:KEY_PASSWORD); fi
          for flavor in standalone parasite; do
            directory="app/build/outputs/apk/$flavor/release"
            source_file="$(jq -r '.elements[0].outputFile' "$directory/output-metadata.json")"
            signed_file="$directory/app-$flavor-release-signed.apk"
            "$signer" sign "${arguments[@]}" --out "$signed_file" "$directory/$source_file"
            echo "${flavor}_file=$signed_file" >> "$GITHUB_OUTPUT"
          done

      - name: Verify and prepare signed APKs
        id: prepare_apks
        shell: bash
        env:
          STANDALONE_SIGNED_RELEASE_FILE: ${{ steps.sign_apks.outputs.standalone_file }}
          PARASITE_SIGNED_RELEASE_FILE: ${{ steps.sign_apks.outputs.parasite_file }}
          VERSION_NAME: ${{ steps.release_metadata.outputs.tag_name }}
          VERSION_CODE: ${{ steps.release_metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          verify_apk() {
            local file="$1" application_id="$2"
            test -s "$file"
            "$build_tools/apksigner" verify "$file"
            "$build_tools/zipalign" -c -P 16 4 "$file"
            test "$("$analyzer" manifest application-id "$file")" = "$application_id"
            test "$("$analyzer" manifest version-name "$file")" = "$VERSION_NAME"
            test "$("$analyzer" manifest version-code "$file")" = "$VERSION_CODE"
            local files
            files="$("$analyzer" files list --files-only "$file")"
            case "$files" in
              *'/assets/xposed_init'*)
                echo '::error::Legacy Xposed declaration is not supported'
                return 1
                ;;
            esac
            if [[ "$application_id" == com.neoruaa.meilox ]]; then
              case "$files" in
                *'/META-INF/xposed/'*)
                  echo '::error::Standalone APK contains Xposed declarations'
                  return 1
                  ;;
              esac
            else
              test "$("$analyzer" files cat --file /META-INF/xposed/java_init.list "$file")" = com.ljyh.mei.parasite.MeiloXModule
              test "$("$analyzer" files cat --file /META-INF/xposed/scope.list "$file")" = com.netease.cloudmusic.tv
              test "$("$analyzer" files cat --file /META-INF/xposed/module.prop "$file")" = $'minApiVersion=102\ntargetApiVersion=102\nstaticScope=true\nautoHotReload=false'
              "$analyzer" dex code --class com.ljyh.mei.parasite.MeiloXModule "$file" > /dev/null
            fi
          }
          verify_apk "$STANDALONE_SIGNED_RELEASE_FILE" com.neoruaa.meilox
          verify_apk "$PARASITE_SIGNED_RELEASE_FILE" com.neoruaa.meilox.parasite
          mkdir -p release-apks
          cp "$STANDALONE_SIGNED_RELEASE_FILE" release-apks/MeiloX-standalone.apk
          cp "$PARASITE_SIGNED_RELEASE_FILE" release-apks/MeiloX-parasite.apk

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_metadata.outputs.standalone_artifact_name }}
          path: release-apks/MeiloX-standalone.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload parasite APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_metadata.outputs.parasite_artifact_name }}
          path: release-apks/MeiloX-parasite.apk
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download standalone APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.standalone_artifact_name }}
          path: release-artifact

      - name: Download parasite APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.parasite_artifact_name }}
          path: release-artifact

      - name: Read release notes
        id: release_notes
        shell: bash
        env:
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
        run: |
          if [[ -n "$INPUT_RELEASE_NOTES" ]]; then
            body="$INPUT_RELEASE_NOTES"
          elif [[ -f .github/release_notes.md ]]; then
            body="$(cat .github/release_notes.md)"
          else
            body="Release ${TAG_NAME}"
          fi

          delimiter="RELEASE_NOTES_${RANDOM}_${RANDOM}"
          {
            echo "body<<${delimiter}"
            echo "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        uses: ncipollo/release-action@v1
        with:
          artifacts: release-artifact/MeiloX-standalone.apk,release-artifact/MeiloX-parasite.apk
          artifactContentType: application/vnd.android.package-archive
          artifactErrorsFailBuild: true
          body: ${{ steps.release_notes.outputs.body }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          makeLatest: true
          name: ${{ needs.build.outputs.release_name }}
          prerelease: ${{ contains(needs.build.outputs.tag_name, '-') }}
          tag: ${{ needs.build.outputs.tag_name }}
          token: ${{ github.token }}
